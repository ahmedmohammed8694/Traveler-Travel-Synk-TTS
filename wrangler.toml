name = "ahmedmohammed8694-riders-ride-sync"
main = "cloudflare-backend/src/index.ts"
compatibility_date = "2026-09-18"

[vars]
ENVIRONMENT = "production"
APP_NAME = "RIDERsYNK"

[triggers]
crons = ["*/5 * * * *"] # Automated 24/7 Database Robot Keep-Alive Ping every 5 minutes

